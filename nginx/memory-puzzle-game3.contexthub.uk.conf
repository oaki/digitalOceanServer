server {
    server_name memory-puzzle-game3.contexthub.uk;

    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:3008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/memory-puzzle-game3.contexthub.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/memory-puzzle-game3.contexthub.uk/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name memory-puzzle-game3.contexthub.uk;
    return 301 https://$host$request_uri;
}
