server {
    server_name analytics.saniolabs.com;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3009;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Umami reads the visitor IP from X-Real-IP only (CLIENT_IP_HEADER in
        # /opt/apps/umami/.env); overwriting it here keeps clients from spoofing it.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/analytics.saniolabs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/analytics.saniolabs.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name analytics.saniolabs.com;
    return 301 https://$host$request_uri;
}
