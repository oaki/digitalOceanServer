server {
    server_name math.contexthub.uk;

    root /opt/apps/saskamath/dist;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/math.contexthub.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/math.contexthub.uk/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name math.contexthub.uk;
    return 301 https://$host$request_uri;
}
