# Postfix relay-only aliases (see CONTEXT.md "Mail Alias" and
# docs/adr/0003-mail-relay-only-no-mailboxes.md). No mail is ever stored on
# the droplet — every alias forwards immediately to an external mailbox.
#
# Installed 2026-07-31 on the NEW droplet (165.22.16.160) for siebi.sk.
# Not installed on the old droplet (142.93.166.76) — never was needed there.

postfix_installed: true
postfix_active: true
postfix_droplet: 165.22.16.160

aliases:
  - address: info@siebi.sk
    forwards_to: pavolbincik@gmail.com
    domain: siebi.sk
    spf_record_added: true   # "v=spf1 mx -all", confirmed live via dig
    mx_record: "siebi.sk, priority 10 (points at itself, since siebi.sk's own A record is the droplet)"
    verified: >
      2026-07-31 — real end-to-end test: email sent from pavolbincik@gmail.com
      arrived, matched the alias, forwarded successfully
      (postfix log: "status=sent (250 2.0.0 OK)" to gmail-smtp-in.l.google.com).
      Also fixed: postfix's installer had put siebi.sk in BOTH `mydestination`
      and `virtual_alias_domains` (a real warning, ambiguous delivery path) —
      removed from mydestination. See docs/mail-alias.md's "Gotcha" note.
    notes: >
      siebi.sk previously had full mail hosting via Websupport (MX to
      mailin1/mailin2, working SPF/DMARC) — those MX records were DELETED
      and replaced with this droplet's, since using Websupport's mail would
      have required a paid hosting-plan attachment; this route is free
      (uses infrastructure already paid for). _dmarc.siebi.sk's DMARC TXT
      record was left as-is; still valid since it isn't SPF/DKIM-specific.
      mail/webmail/smtp/pop3/imap.siebi.sk A records still point at
      Websupport's now-unused mail servers — harmless leftovers, safe to
      delete later, not urgent.
