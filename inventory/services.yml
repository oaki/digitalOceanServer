# Authoritative record of PM2-managed Services and nginx-served Static Sites.
# See CONTEXT.md for what "Service" / "Static Site" mean, and
# docs/adr/0005-inventory-authoritative-for-ports.md for why this file (not a
# live ss/pm2 scan) decides the next port.
#
# Adding a service: scripts/add-service.sh (updates this file, then deploys).
# Adding a static site: scripts/add-static-site.sh.
#
# MID-MIGRATION as of 2026-07-31 — see docs/adr/0008-migrate-droplet-142-to-165.md.
# Everything below is deployed and verified on the NEW droplet
# (165.22.16.160), but DNS cutover is staged per-domain — check
# inventory/domains.yml's `droplet_serving` field for what's actually live
# where right now. Originally snapshotted from the old droplet on 2026-07-30.
#
# All five services now pin an explicit `node_interpreter` (an absolute path
# under /root/.nvm/versions/node/) rather than a bare "node" resolved via
# PATH. This was deliberate: PM2's own boot-time resurrect (systemd unit
# pm2-root.service) does NOT include nvm in its PATH, so a bare "node"
# resolves to the apt/nodesource-installed /usr/bin/node (Node 14.15.3,
# EOL) at boot. Two services (server, worker1) actually depended on that
# apt binary in practice — found and fixed 2026-07-30 ahead of the Ubuntu
# 20.04->24.04 upgrade, since that apt package's source (nodesource's
# node_14.x repo, pinned to "focal") won't resolve on a newer codename.
# pm2-root.service's PATH also now has nvm's v20.20.2 bin prepended as a
# fallback so PM2's own CLI bootstrap doesn't depend on /usr/bin/node either.

# chat (codeChatServer) was decommissioned entirely 2026-07-31 (owner's
# call) — removed from both droplets, no longer tracked here.
node_interpreters:
  chess-analysis-api (server): /root/.nvm/versions/node/v24.18.1/bin/node   # upgraded 2026-09-17; the modernized pino stack requires node: built-ins unavailable in Node 14
  chess-analysis-worker (worker1): /root/.nvm/versions/node/v14.15.3/bin/node   # same as above
  pulseguard-ping-worker: /root/.nvm/versions/node/v24.18.1/bin/node   # new droplet's LTS - no version-specific requirement, dependency-free script
  pulseguard-uptime-worker: /root/.nvm/versions/node/v24.18.1/bin/node   # same
  personal-api: /root/.nvm/versions/node/v24.18.1/bin/node   # new droplet's LTS; PM2 started with --node-args='--env-file=.env' (fastify app reads .env natively via Node's --env-file, no dotenv package)
  videocall-api: /root/.nvm/versions/node/v24.18.1/bin/node
  videocall-web: /root/.nvm/versions/node/v24.18.1/bin/node
  chess-analysis-v3-api: /root/.nvm/versions/node/v24.18.1/bin/node   # runs TypeScript via --import tsx (deploy/ecosystem.config.cjs)
  chess-analysis-v3-worker: /root/.nvm/versions/node/v24.18.1/bin/node

next_free_port: 3009  # 3005-3006 video-call, 3007 chess-analysis-v3-api, 3008 memory-puzzle-game

services:
  - name: server
    dir: chess-analysis-api
    repo: https://github.com/oaki/chess-analysis-api.git
    default_branch: master   # not main
    port: 8080   # legacy field - see deployment below, actually blue-green on 8080/8081
    domain: api.chess-analysis.com
    deployment: >
      BLUE-GREEN as of 2026-08-02 (see docs/adr/0010-blue-green-deploy-for-chess-analysis-api.md).
      Two PM2 processes: chess-analysis-api-blue (dir
      /opt/apps/chess-analysis-api-blue, port 8080) and
      chess-analysis-api-green (dir /opt/apps/chess-analysis-api-green, port
      8081) - each a full separate git checkout. nginx's active backend is
      switched via /etc/nginx/chess-analysis-api-active.conf (an `include`d
      file setting $api_backend), flipped atomically by
      /opt/apps/chess-analysis-api-deploy.sh after health-checking the
      newly-deployed (inactive) color. Redeploy: run that script, or push to
      master through .github/workflows/deploy.yml. The workflow targets the
      new droplet with its dedicated command-restricted DEPLOY_SSH_KEY and
      invokes /opt/apps/chess-analysis-api-deploy.sh.
    redis: >
      Installed 2026-08-02 on the new droplet, capped at 64MB (allkeys-lru)
      via /etc/redis/redis.conf. Provisioned for socket.io's cluster
      adapter as part of considering PM2 cluster mode for zero-downtime
      deploys, but NOT currently wired into the app - blue-green was used
      instead once we found the app's workersIo/usersIo in-memory tracking
      (src/sockets/initSockets.ts) isn't cluster-safe even with the
      adapter (custom app state, not something socket.io's adapter covers).
      Redis sits unused for now; fine to repurpose or remove later if
      nothing else needs it.
    env_keys:
      - APP_ENVIRONMENT
      - SWAGGER_HOST
      - GOOGLE_BASE_URL
      - GOOGLE_REDIRECT_URL
      - GOOGLE_CLIENT_ID
      - GOOGLE_CLIENT_SECRET
      - DB_APP_NAME
      - DB_APP_USER
      - DB_APP_PASS
      - DB_APP_TYPE
      - DB_APP_HOST
      - DB_APP_PORT
      - DB_APP_SYNCHRONIZE
      - DB_EVALUATION_TYPE
      - DB_EVALUATION_NAME
      - DB_EVALUATION_USER
      - DB_EVALUATION_PASS
      - DB_EVALUATION_HOST
      - DB_EVALUATION_PORT
      - POSTGRE_DB_TYPE
      - POSTGRE_DB_NAME
      - POSTGRE_DB_USER
      - POSTGRE_DB_PASS
      - POSTGRE_DB_HOST
      - POSTGRE_DB_PORT
      - DB_GAMES_TYPE
      - DB_GAMES_NAME
      - DB_GAMES_USER
      - DB_GAMES_PASS
      - DB_GAMES_HOST
      - DB_GAMES_PORT
      - DB_GAMES_SYNCHRONIZE
      - SERVER_PORT
      - IO_PORT
      - JWT_KEY
      - CHESS_WATCH_API_KEY
      - NEXT_CHESS_MOVE_COOKIE
    notes: >
      PM2 name "server" collides with the generic term "server" used
      elsewhere in docs (see CONTEXT.md Avoid-list) — kept as-is, renaming a
      live PM2 process isn't worth the churn.

  - name: worker1
    dir: chess-analysis-worker
    repo: https://github.com/oaki/chess-analysis-worker.git
    port: null
    domain: null
    env_keys:
      - APP_ENVIRONMENT
      - API_HOST
      - SYZYGY_PATH
    notes: Background worker — no HTTP port, no domain, no nginx vhost.

  - name: pulseguard-ping-worker
    dir: pulseguard-ping-worker
    repo: git@github-pulseguard:oaki/pulseGuard.git   # private, via SSH deploy key
    repo_subdir: workers/system
    monorepo_checkout: /opt/pulseGuard-monorepo   # shared sparse checkout, see ADR-0006
    port: 3000
    domain: pulseguard-ping-worker.chess-analysis.com
    env_keys:
      - PORT
      - CROSS_CHECK_PSK
    notes: >
      Originally migrated onto a proper git repo 2026-07-30 on the old
      droplet (was "pulseguard-worker", not a git repo — see
      docs/adr/0006-shared-monorepo-clone-for-pulseguard-workers.md, renamed
      to match its domain). Redeployed fresh onto the new droplet 2026-07-31
      as part of the droplet migration (ADR-0008) using the same
      sparse-checkout pattern; a second dedicated deploy key was generated
      for this droplet (GitHub requires unique keys per repo).

  - name: pulseguard-uptime-worker
    dir: pulseguard-uptime-worker
    repo: git@github-pulseguard:oaki/pulseGuard.git   # private, via SSH deploy key
    repo_subdir: workers/uptime/vps
    monorepo_checkout: /opt/pulseGuard-monorepo   # shared sparse checkout, see ADR-0006
    port: 3001
    domain: pulseguard-uptime-worker.chess-analysis.com
    env_keys:
      - PORT
      - CROSS_CHECK_PSK
    notes: >
      Originally migrated onto a proper git repo 2026-07-30 on the old
      droplet (previously not a git repo). Redeployed fresh onto the new
      droplet 2026-07-31 as part of the droplet migration (ADR-0008).

  - name: personal-api
    dir: personal-api
    repo: git@github-personal-api:oaki/personal-api.git   # private, via SSH deploy key
    port: 3004
    domain: api.contexthub.uk
    env_keys:
      - NODE_ENV
      - PORT
      - HOST
      - TZ
      - APP_VERSION
      - PERSONAL_API_KEY
      - EDUPAGE_SCHOOL
      - EDUPAGE_USERNAME
      - EDUPAGE_PASSWORD
      - REDIS_URL
      - LOG_LEVEL
    redis: >
      Uses the droplet's existing shared Redis instance (127.0.0.1:6379, no
      auth, 64MB allkeys-lru) via REDIS_URL - previously installed for
      chess-analysis-api but left unused. First real consumer.
    notes: >
      Deployed 2026-09-02. Fastify app (framework, per pm2 logs). Deploy key
      "personal-api_deploy" regenerated once (original was replaced before
      the GitHub deploy key was actually added) - see github-personal-api
      host alias in the droplet's ~/.ssh/config. NODE_ENV in the .env copied
      to the droplet was "development" at deploy time - confirm with owner
      whether that should be "production".

  - name: videocall-api
    dir: videocall
    repo: git@github-videocall:oaki/videocall.git
    port: 3005
    domain: call.contexthub.uk
    public_paths: /health, /admin/* API routes, /device-enrollments, /calls, /push-subscriptions, /diagnostic-events
    env_keys:
      - DATABASE_URL
      - PORT
      - WEB_ORIGIN
      - TRUSTED_PROXY
      - ADMIN_API_TOKEN
      - LIVEKIT_URL
      - LIVEKIT_API_KEY
      - LIVEKIT_API_SECRET
      - FCM_PROJECT_ID
      - FCM_SERVICE_ACCOUNT_JSON
      - WEB_PUSH_VAPID_SUBJECT
      - WEB_PUSH_VAPID_PUBLIC_KEY
      - WEB_PUSH_VAPID_PRIVATE_KEY
    notes: Shares one monorepo checkout with videocall-web. PostgreSQL is local.

  - name: videocall-web
    dir: videocall
    repo: git@github-videocall:oaki/videocall.git
    port: 3006
    domain: call.contexthub.uk
    env_keys:
      - NEXT_PUBLIC_API_ORIGIN
      - NEXT_PUBLIC_WEB_PUSH_VAPID_PUBLIC_KEY
    notes: Next.js PWA; default nginx route for call.contexthub.uk.

  - name: chess-analysis-v3-api
    dir: chess-analysis-v3   # monorepo; this process runs server/
    repo: git@github-chess-analysis-v3:oaki/chess-analysis-v3.git   # private, read-only deploy key chess-analysis-v3_deploy
    port: 3007
    domain: v3.chess-analysis.com
    pm2_config: deploy/ecosystem.config.cjs (starts both v3 processes)
    database: local PostgreSQL 16, database and role chess_v3
    auto_deploy: >
      GitHub Actions (.github/workflows/deploy.yml in the repo) tests every
      push to main, builds the web export on the runner and deploys API,
      worker and www in one SSH call. Dedicated, command-restricted key
      (ADR-0009, comment "gha-deploy chess-analysis-v3"); forced command
      /opt/apps/chess-analysis-v3-deploy.sh = copy of deploy/auto-deploy.sh,
      kept outside the clone. Forward-only, only commits on origin/main.
      Setup and revoke: deploy/README.md "Automatic deployment".
    env_keys:
      - APP_ENV
      - HTTP_PORT
      - DATABASE_URL
      - TOKEN_ISSUER
      - TOKEN_SIGNING_KEY
      - AUTH_ISSUER
      - AUTH_CLIENT_ID
      - PUBLIC_API_ORIGIN
      - PUBLIC_WEB_ORIGIN
      - AUTH_NATIVE_REDIRECT_URIS
      - TB_MAX_PIECES
      - TB_LICHESS_FALLBACK
    notes: >
      Deployed 2026-10-04 next to v2 (api.chess-analysis.com unchanged).
      Runbook and redeploy steps: deploy/README.md in the repo; post-deploy
      check: `cd server && pnpm smoke --yes`. Secrets in server/.env were
      generated on the droplet (mode 600). AUTH_CLIENT_ID still empty, so
      sign-in answers 503 until SanioAuth registers the client. Opening
      books imported: gm2001 (priority 10) and book_new (11.1M moves,
      priority 5, 1.2 GB in PostgreSQL) on 2026-10-04 with nice/ionice in
      6.2 min; v2 latency stayed 0.18-0.28 s during the import. Source files
      kept in /opt/apps/chess-analysis-v3/books for re-imports.

  - name: chess-analysis-v3-worker
    dir: chess-analysis-v3   # same checkout, runs worker/
    repo: git@github-chess-analysis-v3:oaki/chess-analysis-v3.git
    port: null
    domain: null
    env_keys:
      - API_WS_URL
      - WORKER_SECRET
      - STOCKFISH_PATH
      - THREADS
      - HASH_MB
      - MAX_LINES
      - SYZYGY_PATH
      - SYZYGY_PIECES
    notes: >
      Platform analysis worker (Stockfish 16 from apt, 1 thread, 128 MB hash,
      Syzygy 5-piece tables shared with v2 at /opt/apps/syzygy). Connects to
      the API over ws://127.0.0.1:3007/v1/workers/connect. Registered as
      platform worker "droplet-1".

  - name: memory-puzzle-game
    dir: memory-puzzle-game
    repo: git@github-memory-puzzle-game:oaki/memory-puzzle-game.git
    port: 3008
    domain: memory-puzzle-game3.contexthub.uk
    node_interpreter: /root/.nvm/versions/node/v24.18.1/bin/node
    database: Websupport MySQL
    auto_deploy: >
      GitHub Actions (.github/workflows/deploy.yml) runs the test suite on
      every push to main, then invokes /opt/apps/memory-puzzle-game-deploy.sh
      with a dedicated command-restricted SSH key. The server performs a
      forward-only pull, npm ci, Next.js production build, and PM2 restart.
    env_keys:
      - DATABASE_URL
      - SHADOW_DATABASE_URL
      - SESSION_SECRET
      - SANIO_AUTH_URL
      - SANIO_CLIENT_ID
      - APP_BASE_URL
      - BLOB_READ_WRITE_TOKEN
    notes: >
      Deployed and externally verified 2026-10-13. SanioAuth client
      memory-puzzle-game allows the production callback on this domain.
      The Droplet can connect to the existing Websupport database.

systemd_services:
  - name: videocall-livekit
    binary: /usr/local/bin/livekit-server
    config: /etc/livekit/livekit.yaml
    domain: call.contexthub.uk
    ports:
      - 7880/tcp (loopback-facing signaling via nginx)
      - 7881/tcp (ICE/TCP)
      - 7882/udp (ICE/UDP mux)
      - 3478/udp (TURN/UDP)
      - 5349/tcp (TURN/TLS)
      - 30000-40000/udp (TURN relay allocation range)
    notes: >
      Small self-hosted staging instance, deployed and externally verified on
      2026-10-04; monitor the shared 1-vCPU droplet. Host UDP buffers are tuned
      by /etc/sysctl.d/99-livekit.conf.

static_sites:
  - name: abakus
    dir: abakus
    repo: https://github.com/oaki/abakus.git
    build_output: dist
    domain: abakus.contexthub.uk
    auto_deploy: >
      GitHub Actions builds every push to main, then invokes
      /opt/apps/abakus-deploy.sh through its own command-restricted SSH key.

  - name: saskamath
    dir: saskamath
    repo: git@github-saskamath:oaki/saskaMath.git
    build_output: dist
    domain: math.contexthub.uk
    auto_deploy: >
      GitHub Actions builds every push to main, then invokes
      /opt/apps/saskamath-deploy.sh through its own command-restricted SSH key.

  - name: chess-analysis-v3-web
    dir: chess-analysis-v3/apps/web
    repo: git@github.com:oaki/chess-analysis-v3.git
    build_output: out
    domain: www.chess-analysis.com
    build_status: built locally and rsynced (next build needs ~1.4 GB RAM), see deploy/README.md in the repo
    notes: >
      Replaced chess-analysis-gui on 2026-10-05. Security headers from
      deploy/nginx-web-headers.conf (nginx include from the repo checkout).

  - name: chess-analysis-gui
    dir: chess-analysis-gui
    repo: https://github.com/oaki/chess-analysis-gui.git
    build_output: build
    domain: none (replaced by chess-analysis-v3-web on 2026-10-05, files kept for rollback)
    build_status: STOPGAP — pre-built output copied, not rebuilt from source on this droplet
    notes: >
      Root domain chess-analysis.com 301-redirects to www.chess-analysis.com
      at the nginx level (see inventory/domains.yml) rather than being a
      separate site.

      This is an old webpack 4 / react-scripts-era toolchain that does NOT
      build cleanly on modern Node: hits OpenSSL 3's legacy-provider issue
      AND (after working around that) a strict ESM `exports` resolution
      error in a css-loader/postcss dependency chain. Rather than pin to
      Node 14 workarounds, the user asked to defer a proper rebuild and
      modernize the tooling later instead. As a stopgap (needed urgently
      once DNS for the apex/wildcard was cut over ahead of the rebuild being
      ready), the OLD droplet's already-built `build/` output was copied
      directly via scp — same files, zero rebuild risk, but this directory
      will go stale the next time the source repo changes until the real
      rebuild happens. See task tracking for "Deploy chess-analysis-gui
      static site" for the deferred modernization work.

# PHP support — see docs/deploying-a-php-site.md and
# docs/adr/0007-php-via-ondrej-ppa-shared-fpm-pool.md. Only works on
# Ubuntu 22.04/24.04 (jammy/noble) — the ondrej/php PPA publishes nothing
# for older releases.
php_installed: true   # PHP 8.3.33 via ondrej PPA, installed 2026-07-31 on the new droplet (165.22.16.160)
php_shared_pool_socket: /run/php/php8.3-fpm.sock

php_sites:
  - name: siebi.sk
    dir: siebi.sk
    repo: https://github.com/oaki/siebi.sk.git
    domain: siebi.sk
    framework: laravel (v13.20.0)
    php_version: "8.4"
    fpm_pool: /etc/php/8.4/fpm/pool.d/siebi.conf (dedicated, not the shared 8.3 pool)
    fpm_socket: /run/php/php8.4-fpm-siebi.sock
    db: sqlite (database/database.sqlite)
    build_step: "npm install && npm run build (vite)"
    auto_deploy: >
      GitHub Actions (.github/workflows/deploy.yml in the siebi.sk repo)
      redeploys on every push to main. Uses a DEDICATED, command-restricted
      SSH key (not the main root key) — see ADR-0009. The forced command is
      /opt/apps/siebi.sk-deploy.sh on the droplet (git pull, composer
      install, artisan migrate --force, config/route cache, npm build,
      fix storage/bootstrap-cache ownership).
    env_keys:
      - APP_KEY
      - APP_URL
      - MAIL_MAILER
      - MAIL_HOST
      - MAIL_USERNAME
      - MAIL_PASSWORD
    notes: >
      composer.lock is locked to Symfony/Laravel package versions requiring
      PHP >=8.4, even though composer.json's constraint (^8.3) would allow
      8.3 — hence its own PHP 8.4 pool, separate from the droplet's shared
      8.3 pool used by other PHP sites. Domain originally had full mail
      hosting via Websupport (MX/SPF/DMARC) but that requires a paid hosting
      plan attachment to actually use — owner chose free instead: Websupport
      MX records were replaced with this droplet's own Postfix relay (see
      inventory/mail-aliases.yml). MAIL_MAILER is still the default `log`
      driver (doesn't actually send) until real outgoing mail is needed.
